<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обработка заказов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 900px;">
        <h2 class="mb-4 text-center">🧾 Система обработки заказов</h2>
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">📦 Сводки заказов (Обязательная часть)</h5>
                    </div>
                    <div class="card-body" id="orders-summary-container"></div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">⚙️ Результаты тестов (Доп. часть)</h5>
                    </div>
                    <div class="card-body" id="extra-tests-container"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="dist/orders.js"></script>
</body>
</html>
