<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт цен и доступности товаров</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 750px;">
        <h2 class="mb-4 text-center">📦 Анализ каталога товаров</h2>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">📋 Статистика и логи (вывод также дублируется в консоль F12)</h5>
            </div>
            <div class="card-body">
                <div id="output-container">
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">⚙️ Инструменты валидации (Дополнительная часть)</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="stringPriceInput" class="form-label">Тест валидации цены из строки (Пункт 9):</label>
                    <div class="input-group">
                        <input type="text" id="stringPriceInput" class="form-control" placeholder="Введи цену, например: 150.50 или -50 или abc">
                        <button class="btn btn-secondary" id="validateBtn">Проверить строку</button>
                    </div>
                    <div id="validationResult" class="mt-2 small fw-bold"></div>
                </div>
                <hr>
                <div>
                    <label class="form-label">Тест функции с типом возврата never (Пункт 10):</label>
                    <button class="btn btn-danger d-block w-100" id="neverBtn">Вызвать критическую ошибку (throw Error)</button>
                </div>
            </div>
        </div>
    </div>

    <script src="dist/catalog.js"></script>
</body>
</html>
