<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой трекер расходов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 800px;">
        <h1 class="text-center mb-4">💰 Контроль расходов</h1>

        <div class="card text-white bg-primary mb-4 shadow-sm">
            <div class="card-body text-center">
                <h5 class="card-title text-uppercase opacity-75">Потрачено за все время</h5>
                <p class="display-4 fw-bold mb-0"><span id="total-amount">0</span> ₽</p>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-5">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Добавить расход</h5>
                        <form id="expense-form">
                            <div class="mb-3">
                                <label for="expense-name" class="form-label">На что потратили</label>
                                <input type="text" id="expense-name" class="form-control" placeholder="Например: Продукты" required>
                            </div>
                            <div class="mb-3">
                                <label for="expense-sum" class="form-label">Сумма (₽)</label>
                                <input type="number" id="expense-sum" class="form-control" min="1" placeholder="0" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Добавить запись</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">История расходов</h5>
                            <button id="clear-filter-btn" class="btn btn-sm btn-outline-secondary d-none">Сбросить фильтр</button>
                        </div>
                        
                        <div class="mb-3">
                            <input type="text" id="search-input" class="form-control form-control-sm" placeholder="Поиск по названию...">
                        </div>

                        <ul id="expenses-list" class="list-group list-group-flush overflow-y-auto" style="max-height: 300px;">
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
